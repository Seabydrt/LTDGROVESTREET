<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>LTD Market – Commander</title>
<style>
/* ===== COLORS LTD ===== */
:root{
  --primary:#6d28d9;        /* violet LTD */
  --primary-soft:#ede9fe;   /* violet clair */
  --bg:#0b0b14;             /* fond sombre */
  --card:#1c1c2b;           /* fond carte produit */
  --text:#e5e7eb;           /* texte clair */
  --text-light:#9ca3af;     /* texte secondaire */
  --border:#2a2a40;         /* bordures */
}

/* ===== BASE ===== */
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  justify-content:center;
  padding:40px 0;
}

.container{
  max-width:1000px;
  width:90%;
}

/* ===== HEADER ===== */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

header h1{
  color:var(--primary);
  font-size:28px;
  margin:0;
}

header button{
  padding:8px 12px;
  background:#333;
  color:#fff;
  border:none;
  border-radius:5px;
  cursor:pointer;
}

/* ===== PRODUCT GRID ===== */
.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:20px;
  margin-bottom:30px;
}

.card-product{
  background:var(--card);
  border-radius:8px;
  padding:15px;
  box-shadow:0 2px 8px rgba(0,0,0,0.3);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  transition:transform 0.2s;
}

.card-product:hover{
  transform:translateY(-5px);
}

.card-product img{
  width:100%;
  height:120px;
  object-fit:contain;
  margin-bottom:10px;
}

.card-product h3{
  font-size:16px;
  margin:0 0 5px;
  color:var(--text);
}

.card-product p{
  font-size:14px;
  color:var(--text-light);
  margin:0 0 10px;
}

.card-product input{
  width:60px;
  padding:5px;
  border:1px solid var(--border);
  border-radius:5px;
  background:#111122;
  color:var(--text);
}

.card-product button{
  margin-top:5px;
  padding:8px;
  border:none;
  background:var(--primary);
  color:#fff;
  border-radius:5px;
  cursor:pointer;
  font-weight:bold;
}

.card-product button:hover{
  opacity:0.9;
}

/* ===== CART ===== */
.cart{
  background:var(--card);
  padding:15px;
  border-radius:8px;
  box-shadow:0 2px 8px rgba(0,0,0,0.3);
}

.cart h2{
  margin-top:0;
  font-size:18px;
  margin-bottom:15px;
}

.cart ul{
  list-style:none;
  padding:0;
  margin:0 0 15px 0;
}

.cart li{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
  font-size:14px;
}

.cart button{
  padding:6px 10px;
  background:#7f1d1d;
  color:#fff;
  border:none;
  border-radius:5px;
  cursor:pointer;
}

.cart button:hover{
  opacity:0.9;
}

.checkout{
  padding:10px;
  background:var(--primary);
  color:#fff;
  border:none;
  width:100%;
  border-radius:5px;
  cursor:pointer;
  font-weight:bold;
}

.checkout:hover{
  opacity:0.9;
}
</style>
</head>

// ===== PANIER =====
let cart = [];

// GENERER LES PRODUITS
const productsDiv = document.getElementById("products");
products.forEach((p,i)=>{
  const div = document.createElement("div");
  div.className = "card-product";
  div.innerHTML = `
    <img src="${p.img}" alt="${p.name}">
    <h3>${p.name}</h3>
    <p>Prix: $${p.price}</p>
    <input type="number" min="1" value="1" id="q${i}">
    <button onclick="addToCart(${i})">Ajouter au panier</button>
  `;
  productsDiv.appendChild(div);
});

// AJOUTER AU PANIER
function addToCart(i){
  const qty = Number(document.getElementById("q"+i).value);
  if(!qty || qty<=0){ alert("Quantité invalide"); return; }
  cart.push({name:products[i].name, qty});
  renderCart();
}

// AFFICHER PANIER
function renderCart(){
  const ul = document.getElementById("cartList");
  ul.innerHTML = "";
  cart.forEach((item,i)=>{
    const li = document.createElement("li");
    li.innerHTML = `${item.name} x${item.qty} <button onclick="removeCart(${i})">Supprimer</button>`;
    ul.appendChild(li);
  });
}

// SUPPRIMER ITEM
function removeCart(i){
  cart.splice(i,1);
  renderCart();
}

// VALIDER COMMANDE
function checkout(){
  if(cart.length===0){ alert("Panier vide"); return; }

  const clientName = prompt("Nom du client:");
  const clientTel = prompt("Téléphone:");
  if(!clientName || !clientTel){ alert("Informations manquantes"); return; }

  const cmd = JSON.parse(localStorage.getItem("cmd"))||[];
  cmd.push({client:clientName,tel:clientTel,panier:cart,statut:"En attente"});
  localStorage.setItem("cmd",JSON.stringify(cmd));
  alert("Commande envoyée au LTD !");

  cart=[];
  renderCart();
}

// ADMIN
function goAdmin(){
  window.location.href = "login.html";
}
